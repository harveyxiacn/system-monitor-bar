name: Release

# Tag a version to cut a release:
#   git tag v1.1.0 && git push origin v1.1.0
# or run manually from the Actions tab (workflow_dispatch).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # The sources rely on Swift 6 region-based isolation; pin the newest stable
      # Xcode so CI matches a Swift 6 toolchain (the runner default can be older).
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: swift --version

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Build universal .app
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          ARCH_FLAGS: "--arch arm64 --arch x86_64"
        run: bash ./build.sh

      - name: Verify universal binary
        run: lipo -info SystemMonitorBar.app/Contents/MacOS/SystemMonitorBar

      - name: Make DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash ./scripts/make-dmg.sh

      - name: Write release notes
        run: |
          cat > release-notes.md << 'EOF'
          ## System Monitor Bar v${{ steps.ver.outputs.version }}

          Universal build (Apple Silicon + Intel). Download the `.dmg` below.

          ### Install
          1. Open the `.dmg` and drag **SystemMonitorBar** into **Applications**.
          2. First launch: right-click the app → **Open**, then **Open** again.
          3. If macOS says it's "damaged" or "cannot verify the developer", run once:
             ```
             xattr -dr com.apple.quarantine /Applications/SystemMonitorBar.app
             ```

          This app is open-source and not paid-notarized by Apple, so the one-time
          Gatekeeper prompt above is expected. See the README for details.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "SystemMonitorBar-${{ steps.ver.outputs.version }}.dmg" \
            --title "v${{ steps.ver.outputs.version }}" \
            --notes-file release-notes.md
